<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transporte Express – Arquitectura y Pantallas</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--ink:#1d2330;--mute:#5d6577;--line:#cfd4de;
  --acc:#1f5fbf;--acc2:#e8f0fc;--ok:#1e8e55;--warn:#c9821a;--bad:#c23b3b;
  --seg:#8a4fd6;--gen:#1f5fbf;--ope:#1e8e55;--bat:#c9821a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#14171d;--panel:#1c2029;--ink:#e6e9ef;--mute:#9aa3b5;--line:#343b4a;--acc:#6ea3f5;--acc2:#1f2c45;--ok:#4cc38a;--warn:#e3a94d;--bad:#ee7b7b;--seg:#b58af0;--gen:#6ea3f5;--ope:#4cc38a;--bat:#e3a94d}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
a{color:var(--acc)}
/* sidebar */
#side{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow:auto;padding:14px 0 30px}
#side h1{font-size:15px;margin:0 16px 2px}
#side .sub{font-size:12px;color:var(--mute);margin:0 16px 12px}
#side .g{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 16px 4px;font-weight:600}
#side .g i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#side .g2{font-size:12px;font-weight:600;margin:8px 16px 2px;color:var(--ink)}
#side a{display:block;padding:4px 16px 4px 26px;color:var(--ink);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
#side a:hover{background:var(--acc2)}
#side a.on{background:var(--acc2);border-left-color:var(--acc);font-weight:600}
#side a.top{padding-left:16px;font-weight:600}
main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1150px}
.page{display:none}.page.on{display:block}
h2{font-size:22px;margin:0 0 4px}
.path{font-size:12.5px;color:var(--mute);margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.card h3{margin:0 0 6px;font-size:15px}
.note{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.note>div{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;font-size:13.5px}
.note>div.d{border-left-color:var(--warn)}
.note b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
@media(max-width:900px){body{display:block}#side{width:auto;height:auto;position:static}.note{grid-template-columns:1fr}main{padding:18px 14px}}
/* architecture diagram */
.arch{display:grid;gap:16px}
.root{justify-self:center;background:var(--ink);color:var(--bg);padding:8px 26px;border-radius:8px;font-weight:700}
.cols{display:grid;grid-template-columns:1fr 2.6fr 1.6fr;gap:14px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col{border:2px solid var(--c);border-radius:10px;padding:10px;background:var(--panel)}
.col>h4{margin:0 0 8px;color:var(--c);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1100px){.sub2{grid-template-columns:1fr}}
.grp{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.grp>h5{margin:0 0 6px;font-size:13px}
.grp>h6{margin:6px 0 4px;font-size:11.5px;color:var(--mute);font-weight:600}
.chip{display:block;font-size:12.5px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;margin:3px 0;text-decoration:none;color:var(--ink);background:var(--bg)}
.chip:hover{border-color:var(--acc);background:var(--acc2)}
.chip.new{border-color:var(--ok)}
.chip.new::after{content:" · nuevo";color:var(--ok);font-size:11px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--acc2)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.tag.g{background:#e0f3e9;color:var(--ok)}.tag.r{background:#f8e1e1;color:var(--bad)}.tag.y{background:#fbefd6;color:var(--warn)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.g{background:#1c3a2c}:root:not([data-theme=light]) .tag.r{background:#432427}:root:not([data-theme=light]) .tag.y{background:#40331a}}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:10px 0}
.flow>div{flex:1 1 140px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:13px}
.flow>div b{display:block;color:var(--acc);font-size:12px}
.flow>span{align-self:center;color:var(--mute)}
code{background:var(--acc2);padding:1px 5px;border-radius:4px;font-size:13px}
/* wireframe */
.win{border:2px solid #222;border-radius:6px;background:#fff;color:#222;box-shadow:4px 4px 0 #2224;margin:10px 0 6px;overflow:hidden}
.win .bar{display:flex;align-items:center;gap:8px;border-bottom:2px solid #222;padding:5px 10px;background:#eee;font-size:12.5px}
.win .bar .url{flex:1;border:1.5px solid #222;border-radius:12px;background:#fff;padding:1px 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.win .bar .dots{letter-spacing:3px;font-weight:700}
.win .body{padding:14px 16px}
.win *{color:#222}
.win{font-family:"Segoe Print","Comic Sans MS","Bradley Hand",cursive}
.win .body{font-size:13px}
.win .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.win .hd b{font-size:15px}
.tabs{display:flex;gap:2px;margin-bottom:-2px;position:relative;flex-wrap:wrap}
.tabs span{border:2px solid #222;border-bottom:0;border-radius:6px 6px 0 0;padding:3px 12px;background:#ddd;font-size:12.5px}
.tabs span.on{background:#fff;font-weight:700}
.tabbody{border:2px solid #222;padding:12px;background:#fff}
.btn{display:inline-block;border:2px solid #222;padding:3px 14px;background:#fff;font-size:13px;box-shadow:2px 2px 0 #222;margin-right:4px;border-radius:3px}
.btn.p{background:#d8e6ff}.btn.ok{background:#d6f0df}.btn.no{background:#f6d9d9}
.tb{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}
.tb .search{border:2px solid #222;padding:3px 10px;min-width:180px;font-size:13px;color:#666;border-radius:3px}
.win table{border-collapse:collapse;width:100%;font-size:12.5px}
.win th{background:#ccc;border:2px solid #222;padding:4px 7px;text-align:left;white-space:nowrap}
.win td{border:1px solid #222;padding:4px 7px}
.win tr.sel td{background:#d8e6ff}
.win .st{font-weight:700;font-size:11.5px}
.win .st.g{color:#146c3c}.win .st.r{color:#a22}.win .st.y{color:#8a5a00}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:900px){.ed{grid-template-columns:1fr}}
.panel{border:2px solid #222;padding:8px 10px;border-radius:4px;background:#fafafa}
.panel>.ph{font-weight:700;font-size:12.5px;border-bottom:1.5px solid #222;margin-bottom:6px;padding-bottom:2px;display:flex;justify-content:space-between}
.f{display:grid;grid-template-columns:130px 1fr;gap:6px;align-items:center;margin:5px 0;font-size:12.5px}
.f i{font-style:normal;border:2px solid #222;padding:2px 8px;background:#fff;min-height:24px;border-radius:3px}
.f i.empty{color:#999;background:#f2f2f2}
.f i.dd::after{content:" ▾";float:right}
.msg{border:2px solid #222;padding:6px 10px;margin:8px 0;font-size:12.5px;border-radius:4px}
.msg.ok{background:#d6f0df}.msg.er{background:#f6d9d9}.msg.wa{background:#fbefd6}
.steps{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.steps span{flex:1;min-width:100px;text-align:center;border:2px solid #222;padding:3px;font-size:12px;background:#eee}
.steps span.on{background:#d8e6ff;font-weight:700}
.steps span.done{background:#d6f0df}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:2px solid #222;padding:8px 10px;background:#fafafa;font-size:12px}
.kpi b{display:block;font-size:13px}.kpi .v{font-size:22px;font-weight:700}
.kpi small{display:block;color:#555}
.chart{border:2px solid #222;padding:8px 10px;background:#fafafa}
.chart b{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.qr{width:150px;height:150px;background:
 conic-gradient(#222 25%,#fff 0 50%,#222 0 75%,#fff 0) 0 0/30px 30px;border:6px solid #222;margin:auto}
.doc{border:2px solid #222;padding:14px;background:#fff}
.hm{display:grid;grid-template-columns:110px repeat(7,1fr);gap:2px;font-size:11.5px}
.hm div{padding:4px;text-align:center;border:1px solid #222}
.hm .h{background:#ccc;font-weight:700}
.hm .a{background:#bfe6cf}.hm .m{background:#f7e2a9}.hm .s{background:#f0b3b3}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;border-left:2px solid #222;border-bottom:2px solid #222;padding:0 6px}
.bars div{flex:1;background:#7ea6e8;border:1.5px solid #222;text-align:center;font-size:10.5px;position:relative}
.bars div span{position:absolute;bottom:-18px;left:0;right:0;font-size:10.5px}
.tl{border-left:3px solid #222;margin-left:8px;padding-left:12px}
.tl div{margin:5px 0;font-size:12.5px;position:relative}
.tl div::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;background:#fff;border:2px solid #222;border-radius:50%}
.tl div.d::before{background:#3aa66b}
body.solo #side,body.solo .note,body.solo h2,body.solo .path{display:none}
body.solo main{padding:12px;max-width:none}
body.solo .win{margin:0;box-shadow:none}
</style>
</head>
<body>
<nav id="side"></nav>
<main id="main"></main>

<script>
/* ============ helpers de wireframe ============ */
const win=(url,inner,title)=>`<div class="win"><div class="bar"><span class="dots">● ● ●</span><span class="url">${url}</span><span>${title||''}</span></div><div class="body">${inner}</div></div>`;
const btn=(t,c='')=>`<span class="btn ${c}">${t}</span>`;
const st=t=>{const c=/(HABILIT|DISPON|ACTIV|Sí|OK|CERRAD|EMITID|PAGAD|VIGENTE|CONFORME|Éxito)/i.test(t)?'g':/(SATUR|NO |INACT|ERROR|VENCID|FALL|Alto|Cr[ií]t)/i.test(t)?'r':'y';return `<span class="st ${c}">${t}</span>`};
const table=(cols,rows,opt={})=>`<table><thead><tr>${cols.map(c=>`<th>${c} ▴</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===(opt.sel??-1)?'sel':''}">${r.map((c,j)=>`<td>${(opt.st||[]).includes(j)?st(c):c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const field=(l,v,cls='')=>`<div class="f"><span>${l}</span><i class="${v?cls:'empty '+cls}">${v||'—'}</i></div>`;
const fields=(arr,empty)=>arr.map(([l,v,c])=>field(l,empty?'':v,c||'')).join('');
const filters=(arr)=>`<div class="tb">${arr.map(a=>`<span class="search">${a}</span>`).join('')}${btn('Buscar','p')}</div>`;
const tabs=(list,on)=>`<div class="tabs">${list.map((t,i)=>`<span class="${i===on?'on':''}">${t}</span>`).join('')}</div>`;

/* catálogo: lista + detalle/edición + nuevo (tres estados que pide el profesor) */
function catalog({url,cols,rows,stcols,tabsList,tabOn}){
  const t=tabsList?tabs(tabsList,tabOn||0):'';
  return win(url,`${t}<div class="${tabsList?'tabbody':''}">
   <div class="tb">${btn('Agregar')}${btn('Editar')}${btn('Eliminar')}<span class="search">🔍 Buscar…</span></div>
   ${table(cols,rows,{sel:1,st:stcols||[]})}</div>`);
}
const kpi=(n,v,meta,f,extra)=>`<div class="kpi"><b>${n}</b><span class="v">${v}</span><small>Meta: ${meta}</small><small>Fórmula: ${f}</small><small>${extra}</small></div>`;
const bars=(arr)=>`<div class="bars">${arr.map(([l,h])=>`<div style="height:${h}%"><span>${l}</span></div>`).join('')}</div><div style="height:20px"></div>`;

/* ============ definición de pantallas ============ */
const S={};
const scr=(id,o)=>S[id]=o;

/* --- Seguridad --- */
scr('s_login',{t:'Control de acceso (login)',path:'1. Seguridad',
 purpose:'Primera pantalla: controla QUIÉN entra. Cliente, operario y administrador entran por aquí; “Registrarse” solo crea cuentas de tipo Cliente/Remitente.',
 defend:'El QR no es decoración: el operario en patio lo escanea desde la app móvil de su cuenta para entrar rápido con guantes/en campo. Pregunta típica: “¿por qué QR y cómo funciona?”.',
 render:()=>win('https://www.transporteexpress.com.pe/login',`
  <div style="text-align:center;font-size:20px;font-weight:700;margin-bottom:10px">Bienvenido a Transporte Express</div>
  <div style="display:grid;grid-template-columns:1fr 2px 1fr;gap:20px;align-items:center">
   <div><div style="text-align:center;margin-bottom:10px"><span class="btn" style="padding:16px 30px;font-weight:700">🚚 LOGO</span></div>
    ${field('DNI','')}${field('Contraseña','')}<div style="font-size:12.5px;margin:4px 0">☐ Mostrar contraseña</div>
    <div>${btn('Iniciar sesión','p')}</div><div style="margin-top:8px">${btn('Registrarse (cliente)')}</div>
    <div style="margin-top:8px;font-size:12.5px"><u>¿Olvidaste tu contraseña?</u></div></div>
   <div style="border-left:3px dotted #222;height:240px"></div>
   <div style="text-align:center"><b>Ingresa por QR</b><div class="qr" style="margin-top:8px"></div><div style="font-size:12px;margin-top:6px">Escanea desde la app de Transporte Express</div></div>
  </div>`)});
scr('s_perfiles',{t:'Perfiles y permisos',path:'1. Seguridad',
 purpose:'Controla QUÉ puede hacer cada perfil. Lista de perfiles a la izquierda, módulos/parámetros habilitados a la derecha, con permisos por acción (ver / crear / editar / eliminar).',
 defend:'“¿Qué puede hacer el Operario de Carga y por qué?” → Solo Entrega de servicio, ver ticket y bitácora; no toca catálogos ni ventas. Cliente: solo Venta de ticket y sus reportes.',
 render:()=>win('https://www.transporteexpress.com.pe/seguridad/perfiles',`
  <div class="grid2" style="grid-template-columns:1fr 1.6fr">
   <div class="panel"><div class="ph"><span>PERFILES</span></div>
    ${table(['Perfil','Usuarios'],[['Administrador BD','2'],['Gerente','3'],['Vendedor / Caja','6'],['Op. Transporte (conductor)','48'],['Op. Carga / Descarga','22'],['Cliente / Remitente','1 250']],{sel:1})}
    <div style="margin-top:8px">${btn('Nuevo','p')}${btn('Modificar')}${btn('Eliminar','no')}</div></div>
   <div class="panel"><div class="ph"><span>PRIVILEGIOS — Gerente</span></div>
    ${table(['Módulo / parámetro','Ver','Crear','Editar','Elim.'],[
     ['Parámetros: carga, ruta, horario, contenedor, vehículo','✔','✔','✔','✔'],
     ['Catálogo de producto y recursos','✔','✔','✔','✘'],
     ['Catálogo protocolo / reglas / políticas','✔','✔','✔','✘'],
     ['Consulta de demanda, utilización, incidentes','✔','—','—','—'],
     ['Tablero de KPIs','✔','—','—','—'],
     ['Venta de ticket','✘','✘','✘','✘'],
     ['Batch (generación de tickets, backup)','✔ solo ver','✘','✘','✘']],{sel:-1})}
   </div></div>
  <div class="msg wa">Asignar a un usuario: DNI ▾ ______ Perfil ▾ ______ Estado ▾ Activo ${btn('Asignar','ok')}</div>`)});

/* --- Catálogos (estilo simple: pestañas + tabla) --- */
const T5=['Vehículo','Carga','Contenedor','Ruta','Horario','Operario'];
const H='HABILITADO',NH='NO HABILITADO';
scr('p_vehiculo',{t:'Parámetro de vehículo',path:'2.1.1 Mantenimiento de parámetros',
 purpose:'Unidades vehiculares que la empresa puede usar como recurso: placa, tipo, ejes, carga máxima, consumo por 100 km, kilometraje, nivel de riesgo y si está habilitada.',
 defend:'Peso máximo y consumo por 100 km justifican la tarifa; la capacidad del vehículo impacta el costo. “Estado” en el catálogo = habilitada para operar; el cupo del día sale de Disponibilidad-Recursos.',
 render:()=>catalog({url:'https://www.transporteexpress.com.pe/gerencia/parametros/vehiculo',tabsList:T5,tabOn:0,
  cols:['Código','Placa','Recurso / Tipo','Ejes','Carga máx.','Consumo','Km actual','Riesgo','Estado'],stcols:[8],
  rows:[['r-veh-energ','XYZ123','Vehículo con energía','2','18000 kg','4 L/100km','45200 km','Bajo','DISPONIBLE'],['r-veh-susp','ABC345','Suspensión activa','4','12000 kg','12 L/100km','88100 km','Alto','NO DISPONIBLE'],['r-veh-cist','FGC576','Cisterna volátil','3','25000 kg','15 L/100km','32000 km','Bajo','DISPONIBLE'],['r-veh-std','DEF890','Estándar general','2','8000 kg','8 L/100km','12500 km','Bajo','DISPONIBLE']]})});
scr('p_carga',{t:'Parámetro de tipo de carga',path:'2.1.1 Mantenimiento de parámetros',
 purpose:'Tipos de carga que se pueden transportar: material (perecible, gas, inflamable, general, radioactivo, frágil, tóxico), medidas, peso y temperatura.',
 defend:'Define qué recursos exige el servicio (freezer para perecible, hermético para volátil, etc.).',
 render:()=>catalog({url:'https://www.transporteexpress.com.pe/gerencia/parametros/tipo-carga',tabsList:T5,tabOn:1,
  cols:['Código','Material','Alto','Ancho','Largo','Peso','Temperatura','Estado'],stcols:[7],
  rows:[['CG-001','Perecible','0.5 m','0.5 m','0.5 m','0.5 kg','12 °C',H],['CG-002','Gas','1 m','1 m','1 m','1 kg','−5 °C',H],['CG-003','Frágil','1.5 m','1.5 m','1.5 m','1.5 kg','0 °C',H],['CG-004','Radioactivo','2 m','2 m','2 m','2 kg','45 °C',NH]]})});
scr('p_contenedor',{t:'Parámetro de contenedor',path:'2.1.1 Mantenimiento de parámetros',
 purpose:'Tipos de contenedor vehicular con su material, capacidad en tickets, temperatura y qué cargas admite.',
 defend:'Política del modelo: el material del contenedor debe ser aplicable al tipo de carga.',
 render:()=>catalog({url:'https://www.transporteexpress.com.pe/gerencia/parametros/contenedor',tabsList:T5,tabOn:2,
  cols:['Código','Tipo','Material','Capacidad','Temperatura','Carga admitida','Estado'],stcols:[6],
  rows:[['r-cont-fzr','Freezer','MC-1','30 tickets','−20 / 10 °C','Perecible',H],['r-cont-shk','Anti-shock','MC-2','40 tickets','ambiente','Frágil',H],['r-cont-herm','Hermético','MC-1','20 tickets','0 / 20 °C','Volátil / Gas',H],['r-cont-blind','Blindado','MC-3','10 tickets','ambiente','Radioactivo',NH]]})});
scr('p_ruta',{t:'Parámetro de ruta',path:'2.1.1 Mantenimiento de parámetros',
 purpose:'Rutas origen → destino entre provincias, con paradas programadas y duración. La ruta guía a la unidad durante la entrega.',
 defend:'Origen y destino son las provincias del modelo (LIM, CHI, JUN, TAC, TRU…).',
 render:()=>catalog({url:'https://www.transporteexpress.com.pe/gerencia/parametros/ruta',tabsList:T5,tabOn:3,
  cols:['Código','Origen','Destino','Paradas','Distancia','Duración','Estado'],stcols:[6],
  rows:[['R-001','Lima','Chiclayo','Huacho, Trujillo','770 km','12 h',H],['R-002','Lima','Junín','La Oroya','300 km','6 h',H],['R-003','Trujillo','Tacna','Lima, Ica','1450 km','22 h',H],['R-004','Lima','Loreto','—','—','—',NH]]})});
scr('p_horario',{t:'Parámetro de horario',path:'2.1.1 Mantenimiento de parámetros',
 purpose:'Horarios de salida y llegada de los productos de transporte (día y hora). Con ellos se arma el calendario para generar tickets.',
 defend:'Es horario del producto, no turno del conductor (eso va en operario).',
 render:()=>catalog({url:'https://www.transporteexpress.com.pe/gerencia/parametros/horario',tabsList:T5,tabOn:4,
  cols:['Código','Día salida','Hora salida','Día llegada','Hora llegada','Estado'],stcols:[5],
  rows:[['HOR-001','Lunes','9:00 PM','Martes','10:00 AM',H],['HOR-002','Miércoles','8:00 AM','Miércoles','8:00 PM',H],['HOR-003','Viernes','2:00 PM','Sábado','10:00 AM',H],['HOR-004','Domingo','5:00 AM','Domingo','5:00 PM',NH]]})});
scr('p_operario',{t:'Parámetro de operario',path:'2.1.1 Mantenimiento de parámetros',
 purpose:'Conductores, ayudantes y autómatas de carga/descarga, con su turno y estado.',
 defend:'Aquí van los turnos y pausas del conductor.',
 render:()=>catalog({url:'https://www.transporteexpress.com.pe/gerencia/parametros/operario',tabsList:T5,tabOn:5,

<table class="t"><tr><th>Bloque del modelo conceptual</th><th>Módulo en la arquitectura</th></tr>
<tr><td>1. Definición (Producto, Tipo de carga, Provincias, Horarios, Protocolo, Reglas/Políticas)</td><td><b>Gerencial › Mantenimiento de parámetros</b> (catálogos con CRUD)</td></tr>

P.ticket=`<h2>Lógica de disponibilidad y generación de tickets</h2><div class="path">El punto donde el profesor dijo que las respuestas eran incorrectas</div>
<div class="card"><h3>Idea central</h3><p>La disponibilidad <b>no es “por día o por semana”</b>. Es <b>por recurso y por ventana horaria</b> (fecha-hora inicio → fecha-hora fin), con <b>capacidad máxima</b> y <b>tickets ocupados</b>. La venta reserva cupo en tiempo real sobre esa ventana.</p>
<div class="flow"><div><b>1 · Catálogos</b>Producto (origen, destino, horario, carga) + recursos que exige</div><span>→</span><div><b>2 · BATCH: generación</b>Para cada producto y fecha del rango, busca la ventana y compromete los recursos libres (Evento creador). Crea el lote de tickets = capacidad del recurso más limitante</div><span>→</span><div><b>3 · Disponibilidad</b>Una fila por recurso × ventana: capacidad máx., ocupados, estado</div><span>→</span><div><b>4 · ON-LINE: venta</b>Reserva n tickets en una sola operación atómica</div><span>→</span><div><b>5 · Pago</b>Reserva → vendido. Si vence, el batch la libera</div></div></div>
<div class="card"><h3>Ejemplo con datos del modelo</h3>
<table class="t"><tr><th>Recurso</th><th>Ventana</th><th>Capacidad</th><th>Ocupados</th><th>Estado</th></tr>
<tr><td>r-cont-fzr</td><td>27/06 8:00 → 28/06 9:00</td><td>30</td><td>20</td><td><span class="tag g">disponible</span></td></tr>
<tr><td>r-auto-peres</td><td>27/06 8:00 → 28/06 9:00</td><td>1</td><td>1</td><td><span class="tag r">saturado</span></td></tr>
<tr><td>r-cont-herm</td><td>28/06 8:00 → 29/06 8:00</td><td>20</td><td>20</td><td><span class="tag r">saturado</span></td></tr></table>
<p>Un servicio solo tiene cupo si <b>todos</b> sus recursos tienen cupo en la misma ventana. Cupo del servicio = mínimo de (capacidad − ocupados) de sus recursos.</p></div>
<div class="card"><h3>Reserva en tiempo real (qué decir si preguntan)</h3><ol>
<li>El cliente elige producto y fecha; la pantalla muestra cupo <i>actual</i>, no un dato de ayer.</li>
<li>Al confirmar, en una sola transacción: verificar <code>ocupados + n ≤ capacidad</code> y sumar <code>n</code> a ocupados. Si dos clientes compiten por el último cupo, solo uno lo obtiene (bloqueo de la fila).</li>
<li>Los tickets quedan <b>RESERVADOS</b> con vencimiento (ej. 15 min). Al pagar → <b>VENDIDO</b>. Si vence → el batch libera y baja ocupados.</li>
<li>Si ocupados = capacidad, el estado pasa a <b>SATURADO</b> y el producto deja de ofrecerse en esa ventana.</li>
<li>Antes de reservar se validan las reglas (máx. “r” tickets por remitente; carga volátil compra todo).</li></ol></div>`;

<div class="card"><h3>Preguntas que siempre hace</h3><ol><li>¿Cómo definieron su protocolo y cómo funciona?</li><li>¿Qué puede hacer el perfil X y por qué?</li><li>¿Esta interfaz realmente funciona para su sistema?</li><li>Explíquenme el catálogo y el proceso principal.</li><li>¿Para qué sirve este KPI y cómo se calcula?</li><li>¿Qué significa disponible/no disponible en el catálogo? (habilitado para operar)</li><li>¿Cómo se generan los tickets y cómo verifican disponibilidad en un rango de fechas? (ver <a href="#ticket">Lógica de tickets</a>)</li></ol>
